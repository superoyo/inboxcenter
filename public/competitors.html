<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competitor — FB Inbox Center</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
  <script src="project.js"></script>
  <style>
    .cp-wrap { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .cp-wrap h1 { font-size: 22px; margin-bottom: 4px; }
    .cp-wrap .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .cp-add { display: flex; gap: 10px; align-items: flex-start; }
    .cp-add input { flex: 1; }
    .cp-warn { margin-top: 12px; font-size: 12.5px; color: #b25e00; background: #fff4e0; border-radius: 8px; padding: 9px 12px; line-height: 1.6; }
    .cp-list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
    .cp-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      cursor: pointer; text-decoration: none; color: var(--text);
    }
    .cp-item:hover { border-color: var(--primary); box-shadow: 0 4px 14px rgba(0,0,0,.07); }
    .cp-ava {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 18px;
    }
    .cp-info { flex: 1; min-width: 0; }
    .cp-info .nm { font-weight: 600; font-size: 15px; }
    .cp-info .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .cp-count { text-align: right; flex-shrink: 0; }
    .cp-count b { font-size: 18px; }
    .cp-count span { display: block; color: var(--muted); font-size: 11px; }
    .cp-del { border: none; background: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 6px 8px; border-radius: 8px; flex-shrink: 0; }
    .cp-del:hover { color: var(--red); background: #fdeaee; }
    .cp-empty { border: 2px dashed var(--border); border-radius: 14px; padding: 40px 24px; text-align: center; color: var(--muted); margin-top: 18px; }
    .cp-empty .big { font-size: 44px; display: block; margin-bottom: 10px; }
    .badge-new { background: #fff4e0; color: #b25e00; }
    /* บอกว่าเป็นคู่แข่งของแบรนด์ไหน (มาจากการตั้งค่าใน Admin) */
    .cp-owner { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
    .cp-owner b { color: var(--text); font-weight: 600; }
    .cp-owner .brand { color: var(--primary); font-weight: 600; }
    /* แถบเลือกวิธีเรียง */
    .cp-tools { display: flex; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .cp-tools .lbl { color: var(--muted); font-size: 12.5px; }
    .cp-sort {
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      border-radius: 999px; padding: 5px 13px; font-size: 12.5px; font-family: inherit; cursor: pointer;
    }
    .cp-sort:hover { background: var(--bg); color: var(--text); }
    .cp-sort.on { border-color: var(--primary); color: var(--primary); background: #e7f0fe; font-weight: 600; }
    /* หัวกลุ่มตอนจัดกลุ่มตามเพจของเรา */
    .cp-group { margin-top: 20px; }
    .cp-group-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
    .cp-group-head .g-ava {
      width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 12px;
    }
    .cp-group-head .g-nm { font-weight: 700; font-size: 14px; }
    .cp-group-head .g-ct { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <span data-global-menu></span>
    <a class="logo" href="projects.html">📥 FB Inbox Center</a>
    <span class="spacer"></span>
    <a class="nav-link active" href="competitors.html">Competitor</a>
    <a class="nav-link" href="connect.html">Connect</a>
  </nav>

  <div class="cp-wrap">
    <h1>⚔️ Competitor</h1>
    <div class="sub">ติดตามโพสต์ของเพจคู่แข่ง — ใส่แค่ URL เพจ แล้วกดดึงข้อมูลเพื่อดูปฏิทินคอนเทนต์</div>

    <div class="card">
      <div class="cp-add">
        <input type="text" id="urlInput" placeholder="https://www.facebook.com/systemathailand" autocomplete="off">
        <button class="btn" id="addBtn">+ เพิ่มเพจ</button>
      </div>
      <p id="addError" class="error-text" style="margin-top: 10px; display: none;"></p>
      <div class="cp-warn" id="apifyWarn" style="display: none;">
        ⚠️ ยังไม่ได้ตั้งค่า <code>APIFY_TOKEN</code> ใน environment — เพิ่มเพจได้ แต่ยังดึงข้อมูลไม่ได้
        (ตั้งค่าที่ Railway → Variables แล้ว deploy ใหม่)
      </div>
    </div>

    <div class="cp-tools" id="tools" hidden>
      <span class="lbl">เรียงแบบ</span>
      <button class="cp-sort" id="sortAz" onclick="setSort('az')">ก–ฮ / A–Z</button>
      <button class="cp-sort" id="sortGroup" onclick="setSort('group')">จัดกลุ่มตามเพจของเรา</button>
    </div>

    <div id="list"><p class="muted" style="margin-top:18px;">กำลังโหลด...</p></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
    function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    const COLORS=['#1877f2','#e91e63','#8e24aa','#5e35b1','#3949ab','#00897b','#f4511e','#6d4c41','#546e7a','#c2185b','#2e7d32','#ef6c00'];
    function color(k){ let h=0; for(const ch of String(k||'?')) h=(h*31+ch.codePointAt(0))>>>0; return COLORS[h%COLORS.length]; }
    const fmtDate=(iso)=> iso ? new Date(iso).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}) : 'ยังไม่เคยดึง';

    // ---- วิธีเรียง: A–Z หรือจัดกลุ่มตามเพจของเรา (จำค่าไว้ต่อเครื่อง) ----
    const SORT_KEY = 'cp_sort';
    let sortMode = localStorage.getItem(SORT_KEY) === 'group' ? 'group' : 'az';
    let cached = [];

    function setSort(mode){
      sortMode = mode;
      localStorage.setItem(SORT_KEY, mode);
      render();
    }

    const byName = (a, b) =>
      String(a.name || a.handle).localeCompare(String(b.name || b.handle), 'th', { numeric: true });

    /** บรรทัดเล็กใต้ชื่อ: เป็นคู่แข่งของแบรนด์ไหน (มาจากที่กรอกไว้ในหน้า Admin) */
    function ownerLine(c){
      if(!c.owners || !c.owners.length) return '<div class="cp-owner">เพิ่มเองในหน้านี้ · ยังไม่ได้ผูกกับเพจของเรา</div>';
      const parts = c.owners.map(o => {
        const brand = o.brandName && o.brandName !== c.name ? ` <span class="brand">(${esc(o.brandName)})</span>` : '';
        return `<b>${esc(o.pageName)}</b>${brand}`;
      });
      return `<div class="cp-owner">⚔️ คู่แข่งของ ${parts.join(' · ')}</div>`;
    }

    function itemHtml(c){
      const covered = (c.coveredFrom && c.coveredTo)
        ? `ข้อมูลช่วง ${c.coveredFrom} → ${c.coveredTo}`
        : '<b style="color:#b25e00;">ยังไม่เคยดึงข้อมูล — กดเข้าไปแล้วกดดึงข้อมูล</b>';
      const linked = (c.owners || []).length > 0;
      return `
        <a class="cp-item" href="competitor.html?id=${encodeURIComponent(c.id)}">
          ${c.pictureUrl
            ? `<img class="cp-ava" src="${esc(c.pictureUrl)}" alt="">`
            : `<span class="cp-ava" style="background:${color(c.id)}">${esc((c.name||'?')[0].toUpperCase())}</span>`}
          <div class="cp-info">
            <div class="nm">${esc(c.name || c.handle)}</div>
            <div class="meta">facebook.com/${esc(c.handle)} · ดึงล่าสุด: ${fmtDate(c.lastSyncAt)}</div>
            <div class="meta">${covered}</div>
            ${ownerLine(c)}
          </div>
          <div class="cp-count"><b>${c.postCount}</b><span>โพสต์</span></div>
          <button class="cp-del" title="ลบเพจนี้"
            onclick="event.preventDefault();event.stopPropagation();removeCompetitor('${esc(c.id)}','${esc((c.name||c.handle).replace(/'/g,"\\'"))}',${linked})">🗑</button>
        </a>`;
    }

    function renderAz(items){
      return '<div class="cp-list">' + [...items].sort(byName).map(itemHtml).join('') + '</div>';
    }

    /** จัดกลุ่มตามเพจของเรา — คู่แข่งหนึ่งรายอยู่ได้หลายกลุ่มถ้าหลายเพจระบุไว้ */
    function renderGrouped(items){
      const groups = new Map(); // pageId -> { name, items[] }
      const orphans = [];
      for(const c of items){
        if(!c.owners || !c.owners.length){ orphans.push(c); continue; }
        for(const o of c.owners){
          const g = groups.get(o.pageId) || { name: o.pageName, items: [] };
          g.items.push(c);
          groups.set(o.pageId, g);
        }
      }
      const head = (id, name, n) => `
        <div class="cp-group-head">
          <span class="g-ava" style="background:${color(id)}">${esc((name||'?')[0].toUpperCase())}</span>
          <span class="g-nm">${esc(name)}</span>
          <span class="g-ct">· ${n} คู่แข่ง</span>
        </div>`;
      let html = '';
      for(const [pageId, g] of [...groups.entries()].sort((a,b)=>a[1].name.localeCompare(b[1].name,'th'))){
        html += `<div class="cp-group">${head(pageId, g.name, g.items.length)}
          <div class="cp-list">${[...g.items].sort(byName).map(itemHtml).join('')}</div></div>`;
      }
      if(orphans.length){
        html += `<div class="cp-group">${head('อื่น ๆ', 'ไม่ได้ผูกกับเพจของเรา', orphans.length)}
          <div class="cp-list">${[...orphans].sort(byName).map(itemHtml).join('')}</div></div>`;
      }
      return html;
    }

    function render(){
      $('sortAz').classList.toggle('on', sortMode === 'az');
      $('sortGroup').classList.toggle('on', sortMode === 'group');
      if(!cached.length){
        $('tools').hidden = true;
        $('list').innerHTML = `<div class="cp-empty"><span class="big">⚔️</span>
          <div>ยังไม่มีเพจคู่แข่ง</div>
          <div style="margin-top:6px;">วาง URL เพจ Facebook ด้านบน หรือกรอกคู่แข่งไว้ในเมนู Admin ของแต่ละเพจ แล้วระบบจะดึงมาให้เอง</div></div>`;
        return;
      }
      $('tools').hidden = false;
      $('list').innerHTML = sortMode === 'group' ? renderGrouped(cached) : renderAz(cached);
    }

    async function load(){
      const data = await fetch('/api/competitors').then(r=>r.json()).catch(()=>({items:[]}));
      $('apifyWarn').style.display = data.apifyReady ? 'none' : 'block';
      cached = data.items || [];
      render();
    }

    async function addCompetitor(){
      const url = $('urlInput').value.trim();
      const err = $('addError'); err.style.display='none';
      if(!url){ err.textContent='กรุณาใส่ URL เพจ'; err.style.display='block'; return; }
      const btn = $('addBtn'); btn.disabled=true; btn.textContent='กำลังเพิ่ม...';
      try{
        const res = await fetch('/api/competitors',{
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ url })
        });
        const d = await res.json();
        if(!res.ok) throw new Error(d.error);
        $('urlInput').value='';
        toast(`เพิ่มเพจ "${d.competitor.name}" แล้ว — กดเข้าไปเพื่อดึงข้อมูล`);
        load();
      }catch(e){ err.textContent=e.message; err.style.display='block'; }
      finally{ btn.disabled=false; btn.textContent='+ เพิ่มเพจ'; }
    }

    async function removeCompetitor(id, name, linked){
      const warn = linked
        ? `\n\nเพจนี้มาจากช่องคู่แข่งในเมนู Admin — ลบที่นี่แล้วจะกลับมาอีกเมื่อโหลดหน้าใหม่\nถ้าต้องการเอาออกถาวร ให้ลบแถวคู่แข่งในหน้า Admin ของเพจนั้นก่อน`
        : '';
      if(!confirm(`ลบเพจคู่แข่ง "${name}"? โพสต์ที่ดึงมาแล้วจะถูกลบด้วย${warn}`)) return;
      await fetch('/api/competitors/'+encodeURIComponent(id), { method:'DELETE' });
      toast('ลบแล้ว'); load();
    }

    $('addBtn').addEventListener('click', addCompetitor);
    $('urlInput').addEventListener('keydown',(e)=>{ if(e.key==='Enter') addCompetitor(); });
    load();
  </script>
</body>
</html>
