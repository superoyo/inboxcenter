<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คอมเมนต์ — FB Inbox Center</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
  <script src="project.js"></script>
  <script src="history.js"></script>
  <style>
    .cm-layout {
      display: grid;
      grid-template-columns: 1fr 420px;
      height: calc(100vh - 56px);
      background: var(--card);
    }
    html.embed .cm-layout { height: 100vh; }
    .cm-left { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .cm-left-head {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .cal-nav-group { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .cal-title { font-weight: 700; font-size: 16px; min-width: 130px; text-align: center; }
    .cal-nav {
      border: 1px solid var(--border); background: var(--card); border-radius: 8px;
      width: 32px; height: 32px; font-size: 16px; cursor: pointer; color: var(--text);
    }
    .cal-nav:hover { background: var(--bg); }

    /* ปฏิทินโพสต์ */
    .cal-wrap { flex: 1; overflow-y: auto; padding: 10px 14px 20px; }
    .cal-dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 4px; }
    .cal-dow span { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
    /* ทุกช่องกว้าง+สูงเท่ากันหมด ไม่ว่าเนื้อหา/เดือน/ขนาดจอ
       minmax(0,1fr): คุมความกว้างให้เท่ากันเป๊ะ — กัน URL/ข้อความยาวตัดคำไม่ได้ดันคอลัมน์ให้กว้างเกิน
       grid-auto-rows 135px: คุมความสูงคงที่ */
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; grid-auto-rows: 135px; }
    .cal-cell {
      border: 1px solid var(--border); border-radius: 8px; height: 135px; min-width: 0;
      padding: 4px; display: flex; flex-direction: column; gap: 3px; overflow: visible;
    }
    /* ปุ่ม +N โพสต์ + popup เลือกโพสต์ของวันนั้น */
    .cal-more { position: relative; }
    .cal-more-btn {
      display: inline-block; font-size: 10px; font-weight: 700; color: var(--primary);
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 1px 6px; cursor: pointer;
    }
    .cal-more-btn:hover { background: #e7f0fe; }
    .cal-more-menu {
      display: none; position: absolute; top: 100%; left: 0; z-index: 60; width: 230px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.18); padding: 4px; margin-top: 2px;
    }
    .cal-more:hover .cal-more-menu { display: block; }
    .cal-more-item { display: flex; gap: 7px; padding: 6px 7px; border-radius: 6px; cursor: pointer; align-items: center; }
    .cal-more-item:hover { background: var(--bg); }
    .cal-more-item.sel { background: #e7f0fe; }
    .cal-more-item img { width: 30px; height: 30px; object-fit: cover; border-radius: 5px; flex-shrink: 0; background: var(--bg); }
    .cal-more-item .t {
      font-size: 11px; line-height: 1.3; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .cal-cell.empty { border-color: transparent; background: transparent; }
    .cal-cell.today { border-color: var(--primary); }
    .cal-cell .daynum { font-size: 12px; font-weight: 700; color: var(--muted); padding: 1px 3px; }
    .cal-cell.today .daynum { color: var(--primary); }
    .cal-post {
      cursor: pointer; border-radius: 6px; overflow: hidden; min-width: 0;
      border: 1px solid var(--border); background: var(--card);
    }
    .cal-post:hover { border-color: var(--primary); }
    .cal-post.active { outline: 2px solid var(--primary); }
    .cal-post img,
    .cal-post .cp-noimg { width: 100%; height: 40px; object-fit: cover; display: block; background: var(--bg); }
    .cal-post .cp-txt {
      font-size: 10.5px; line-height: 1.3; padding: 2px 4px;
      /* จองพื้นที่ 2 บรรทัดเสมอ (2 × line-height) ให้การ์ดสูงเท่ากันไม่ว่าข้อความสั้น/ยาว */
      min-height: 2.6em;
      /* ตัดคำ URL/ข้อความยาวได้ ไม่ให้ดันความกว้างช่อง */
      overflow-wrap: anywhere;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .cal-post .cp-eng {
      display: flex; gap: 6px; font-size: 9.5px; color: var(--muted);
      /* ไม่ให้ badge ตกบรรทัดตอนจอแคบ — คงความสูง 1 บรรทัดเสมอ */
      padding: 0 4px 3px; flex-wrap: nowrap; overflow: hidden;
    }
    .cal-post .cp-eng span { white-space: nowrap; }

    /* คอลัมน์ขวา: คอมเมนต์ */
    .cm-right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .cm-post-head { padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .cm-post-head .txt { font-size: 14px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    /* แถบ engagement: reactions / comments / shares */
    .eng-bar { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; }
    .eng-bar .eng { display: flex; align-items: center; gap: 5px; color: var(--text); }
    .eng-bar .eng b { font-weight: 700; }
    .eng-bar .eng span { color: var(--muted); font-size: 12px; }
    /* รูปโพสต์ในคอลัมน์ขวา */
    .post-hero { width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; margin-top: 10px; cursor: zoom-in; background: var(--bg); }
    /* ---- ตรวจโฆษณากับระบบ อย. (FDA Verify) ---- */
    /* ปุ่มอยู่บรรทัดบน · ผลตรวจลงบรรทัดของตัวเองเต็มความกว้าง (คอลัมน์ขวาแคบ) */
    .fda-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .fda-btn { flex-shrink: 0; }
    .fda-out { flex-basis: 100%; }
    .fda-out:empty { display: none; }
    /* bubble ผลตรวจ — สีตามผลสรุปของ อย. (เขียว/เหลือง/ส้ม/แดง) */
    .fda-bubble {
      border: 1.5px solid; border-radius: 18px;
      padding: 8px 14px; font-size: 13px; line-height: 1.45;
      display: flex; align-items: flex-start; gap: 8px;
      text-align: left;
    }
    .fda-bubble .dot { flex-shrink: 0; font-size: 12px; line-height: 1.45; }
    .fda-bubble .label { font-weight: 700; }
    .fda-bubble .score { color: var(--muted); font-weight: 500; font-size: 12px; }
    .fda-ok    { border-color: #22a06b; background: #eaf7f1; color: #14603f; }
    .fda-cond  { border-color: #d4a017; background: #fdf6e3; color: #7a5c00; }
    .fda-appr  { border-color: #e08b1e; background: #fdf3e4; color: #8a5200; }
    .fda-block { border-color: #d93025; background: #fdecea; color: #8c1d18; }
    .fda-err   { border-color: var(--border); background: var(--bg); color: var(--muted); }
    .fda-bubble.loading { border-style: dashed; }
    /* ---- ลิ้นชักผลตรวจ (สไลด์จากขวา) ---- */
    .fda-scrim {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(0,0,0,.35);
      opacity: 0; transition: opacity .22s ease;
    }
    .fda-scrim.show { opacity: 1; }
    .fda-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 91;
      width: min(1120px, 96vw);
      background: var(--card);
      box-shadow: -8px 0 30px rgba(0,0,0,.18);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .26s cubic-bezier(.22,.7,.3,1);
    }
    .fda-drawer.show { transform: translateX(0); }
    .fda-dhead {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .fda-dhead .t { font-weight: 800; font-size: 15px; }
    .fda-dhead .x {
      margin-left: auto; border: 0; background: none; cursor: pointer;
      font-size: 22px; line-height: 1; color: var(--muted); padding: 2px 6px; border-radius: 6px;
    }
    .fda-dhead .x:hover { background: var(--bg); color: var(--text); }
    /* ผลสรุปพาดเต็มความกว้างใต้หัวเรื่อง */
    .fda-dverdict { padding: 12px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .fda-dverdict:empty { display: none; }
    /* สองคอลัมน์: ซ้าย = ภาพ + ข้อความที่ตรวจ · ขวา = รายละเอียดที่ตรวจพบ */
    .fda-dcols {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    }
    .fda-dtop {
      display: flex; flex-direction: column; gap: 8px; min-height: 0;
      padding: 14px 16px 16px; border-right: 1px solid var(--border);
    }
    .fda-dimg {
      width: 100%; max-height: 38vh; object-fit: contain;
      border-radius: 10px; background: var(--bg); cursor: zoom-in; flex-shrink: 0;
    }
    /* กินพื้นที่ที่เหลือของคอลัมน์ แล้วเลื่อนในตัวเอง — การกระโดดหาคำจึงทำงานในกล่องนี้ */
    .fda-dtext {
      flex: 1; min-height: 120px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 13.5px; line-height: 1.85;
      overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    .fda-dtext-cap { font-size: 11.5px; color: var(--muted); margin: 0; flex-shrink: 0; }
    /* จอแคบ (หรือฝังในกรอบเล็ก) → กลับไปเรียงบนล่างเหมือนเดิม */
    @media (max-width: 860px) {
      .fda-dcols { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .fda-dtop { border-right: 0; border-bottom: 1px solid var(--border); }
      .fda-dimg { max-height: 22vh; }
      .fda-dtext { flex: 0 0 auto; max-height: 26vh; }
    }
    /* คำที่ตรวจพบ — สีตามความหนักของปัญหา */
    /* สีมาจาก JS (จานสี FDA_COLORS) — หนึ่งข้อหนึ่งสี ไม่ใช่หนึ่งหมวดหนึ่งสี */
    .fda-hl { border-radius: 3px; padding: 1px 2px; cursor: pointer; scroll-margin: 40px; color: inherit; }
    @keyframes fdaFlash { 0%,100% { filter: none; } 35% { filter: brightness(.82); } }
    .fda-hl.flash { animation: fdaFlash .8s ease 2; }
    /* รายการข้อที่ตรวจพบ */
    .fda-dbody { flex: 1; overflow-y: auto; padding: 4px 18px 20px; }
    .fda-sec { font-weight: 800; font-size: 13px; margin: 14px 0 6px; display: flex; gap: 6px; }
    .fda-item {
      border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px;
      padding: 9px 11px; margin-bottom: 8px; font-size: 12.5px; line-height: 1.55;
      cursor: pointer; background: var(--card);
    }
    .fda-item:hover { background: var(--bg); }
    .fda-item.no-jump { cursor: default; }
    /* ตอนถูกเลือกใช้วงแหวนแทนการเปลี่ยนสีขอบ ไม่งั้นจะกลืนสีประจำข้อไป */
    .fda-item.on { box-shadow: 0 0 0 2px var(--primary); }
    .fda-item .it-title { font-weight: 700; }
    .fda-item .it-dot {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      margin-right: 6px; vertical-align: 1px;
    }
    .fda-item .it-clause { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
    .fda-item .it-body { margin-top: 5px; }
    .fda-item .hit {
      display: inline-block; border-radius: 4px; padding: 0 5px;
      margin: 4px 4px 0 0; font-size: 11.5px; background: var(--bg); border: 1px solid var(--border);
    }
    .fda-item .jump { color: var(--primary); font-size: 11.5px; margin-top: 5px; display: block; }
    .fda-foot { color: var(--muted); font-size: 11px; margin-top: 14px; line-height: 1.5; }

    /* สถิติเชิงลึก */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat-box { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
    .stat-box .sv { font-size: 17px; font-weight: 800; color: var(--text); }
    .stat-box .sl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .cm-list { flex: 1; overflow-y: auto; padding: 16px 18px; background: var(--card); }

    /* คอมเมนต์สไตล์ Facebook: avatar เล็ก + bubble เทาหุ้มพอดีข้อความ + แถว action เล็กใต้ bubble */
    .cmt { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
    .cmt .ava, .cmt .ava-fb {
      width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 13px;
    }
    .cmt .box { min-width: 0; max-width: 76%; }
    .cmt .bub {
      display: inline-block;
      background: #f0f2f5;
      border-radius: 16px;
      padding: 7px 12px;
      font-size: 13.5px;
      line-height: 1.45;
      word-break: break-word;
      text-align: left;
    }
    .cmt.by-page .bub { background: #e7f0fe; }
    .cmt .bub .txt { white-space: pre-wrap; }
    .cmt .who { font-weight: 600; font-size: 13px; margin-bottom: 1px; }
    .cmt.by-page .who { color: var(--primary); }
    .cmt .sub {
      font-size: 12px; color: var(--muted); margin: 3px 0 0 12px;
      display: flex; gap: 14px; align-items: center;
    }
    .cmt .sub .act { font-weight: 600; cursor: pointer; color: var(--muted); }
    .cmt .sub .act:hover { text-decoration: underline; }
    .cmt img.att { max-width: 220px; border-radius: 12px; display: block; margin-top: 6px; cursor: zoom-in; }
    .cmt-replies { margin: 6px 0 0 40px; }

    .reply-inline { display: flex; gap: 8px; margin: 6px 0 0 40px; }
    .reply-inline input { flex: 1; border-radius: 18px; font-size: 13px; padding: 7px 13px; background: #f0f2f5; border-color: transparent; }

    .cm-empty { flex: 1; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; color: var(--muted); }
    .cm-empty .big { font-size: 42px; }

    /* dropdown เพจ (เหมือนหน้า Analytics) */
    .pg-dd { position: relative; }
    .pg-dd-btn {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 9px 12px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-weight: 600; font-family: inherit; color: var(--text); cursor: pointer;
    }
    .pg-dd-btn:hover { background: var(--bg); }
    .pg-dd-btn .caret { margin-left: auto; color: var(--muted); font-size: 11px; }
    .pg-dd-menu {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 100;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.16); max-height: 55vh; overflow-y: auto; padding: 5px;
    }
    .pg-dd-menu.open { display: block; }
    .pg-dd-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
    .pg-dd-item:hover { background: var(--bg); }
    .pg-dd-item.active { background: #e7f0fe; color: var(--primary); font-weight: 600; }
    .pg-dd-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pg-ava, .pg-ava-fb {
      width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700;
    }

    @media (max-width: 800px) {
      .cm-layout { grid-template-columns: 1fr; }
      .cm-right { display: none; }
      .cm-layout.post-open .cm-left { display: none; }
      .cm-layout.post-open .cm-right { display: flex; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <span data-global-menu></span>
    <a class="logo" href="projects.html">📥 FB Inbox Center</a>
    <span class="spacer"></span>
    <a class="nav-link" href="competitors.html">Competitor</a>
    <a class="nav-link" href="connect.html">Connect</a>
    <button class="btn small" id="refreshBtn">🔄 ดึงคอมเมนต์ใหม่</button>
  </nav>

  <div class="subnav">
    <a class="nav-link" href="index.html">Inbox</a>
    <a class="nav-link active" href="comments.html">Content</a>
    <a class="nav-link" href="analytics.html">Analytics</a>
    <a class="nav-link" href="report.html">Report</a>
    <a class="nav-link" href="admin.html">Admin</a>
  </div>

  <div class="cm-layout" id="cmLayout">
    <!-- ซ้าย: เลือกเพจ + รายการโพสต์ -->
    <aside class="cm-left">
      <div class="cm-left-head">
        <div class="pg-dd" id="pgDd" style="min-width: 220px;">
          <button class="pg-dd-btn" id="pgDdBtn">
            <span id="pgDdAvaWrap" style="display:flex;"><span class="pg-ava-fb" style="background:var(--primary);">📄</span></span>
            <span id="pgDdLabel">เลือกเพจ...</span>
            <span class="caret">▼</span>
          </button>
          <div class="pg-dd-menu" id="pgDdMenu"></div>
        </div>
        <button class="btn small secondary" data-sync-history title="ประวัติการดึงข้อมูล">📜 ประวัติการดึงข้อมูล</button>
        <div class="cal-nav-group">
          <button class="cal-nav" id="calPrev">‹</button>
          <span class="cal-title" id="calTitle"></span>
          <button class="cal-nav" id="calNext">›</button>
        </div>
      </div>
      <div class="cal-wrap" id="calWrap">
        <div class="cm-empty"><span class="big">📅</span>เลือกเพจเพื่อดูปฏิทินโพสต์</div>
      </div>
    </aside>

    <!-- ขวา: คอมเมนต์ของโพสต์ที่เลือก -->
    <main class="cm-right" id="cmRight">
      <div class="cm-empty">
        <span class="big">💬</span>
        <div>เลือกโพสต์จากด้านซ้ายเพื่อดูคอมเมนต์</div>
        <div class="muted">ตอบคอมเมนต์ในนามเพจได้จากตรงนี้เลย</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <!-- คลิกรูปเพื่อดูขนาดใหญ่ -->
  <div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
    <img id="lightboxImg" alt="">
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let pages = [];
    let selectedPage = null;
    let posts = [];
    let activePostId = null;
    let currentComments = [];
    let dayPostSel = {}; // dayKey -> postId ที่เลือกแสดงในวันที่มีหลายโพสต์
    let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const AVATAR_COLORS = [
      '#1877f2', '#e91e63', '#8e24aa', '#5e35b1', '#3949ab', '#00897b',
      '#f4511e', '#6d4c41', '#546e7a', '#c2185b', '#2e7d32', '#ef6c00',
    ];
    function avatarColor(key) {
      let h = 0;
      for (const ch of String(key || '?')) h = (h * 31 + ch.codePointAt(0)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }

    function fmtAgo(iso) {
      const d = new Date(iso);
      const now = new Date();
      const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
      const diff = Math.round((startOfDay(now) - startOfDay(d)) / 86400e3);
      if (diff <= 0) return 'วันนี้ ' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      if (diff === 1) return 'เมื่อวาน';
      return diff + ' วันก่อน';
    }

    function openLightbox(src) {
      $('lightboxImg').src = src;
      $('lightbox').classList.add('show');
    }

    // ---------- dropdown เพจ ----------
    function pgAvatarHtml(p, size) {
      const cls = size || '';
      const fallback = `<span class="pg-ava-fb" style="background:${avatarColor(p.id)};${p.pictureUrl ? 'display:none;' : ''}">${esc((p.name || '?')[0])}</span>`;
      if (!p.pictureUrl) return fallback;
      return `<img class="pg-ava" src="${esc(p.pictureUrl)}" alt=""
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${fallback}`;
    }

    async function loadPages() {
      pages = await fetch('/api/pages').then((r) => r.json());
      pages.sort((a, b) => a.name.localeCompare(b.name, 'th'));
      $('pgDdMenu').innerHTML = pages.map((p) => `
        <div class="pg-dd-item ${selectedPage && selectedPage.id === p.id ? 'active' : ''}" onclick="selectPage('${esc(p.id)}')">
          ${pgAvatarHtml(p)}
          <span>${esc(p.name)}</span>
        </div>`).join('');
      // เพจที่เลือกไว้จากแท็บอื่นก่อน ไม่งั้นค่อยเอาเพจแรก
      if (!selectedPage && pages.length)
        selectPage(pages.some((p) => p.id === window.SelectedPageId) ? window.SelectedPageId : pages[0].id);
    }

    function selectPage(id) {
      selectedPage = pages.find((p) => p.id === id);
      if (!selectedPage) return;
      if (window.setSelectedPageId) window.setSelectedPageId(id);
      $('pgDdLabel').textContent = selectedPage.name;
      $('pgDdAvaWrap').innerHTML = pgAvatarHtml(selectedPage);
      $('pgDdMenu').classList.remove('open');
      loadPages(); // อัปเดต active ในเมนู
      loadPosts();
    }

    $('pgDdBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      $('pgDdMenu').classList.toggle('open');
    });
    document.addEventListener('click', () => $('pgDdMenu').classList.remove('open'));

    // ---------- โพสต์ (ปฏิทิน) ----------
    async function loadPosts() {
      if (!selectedPage) return;
      activePostId = null;
      dayPostSel = {};
      $('calWrap').innerHTML = '<div class="cm-empty"><span class="big">⏳</span>กำลังดึงโพสต์...</div>';
      try {
        const res = await fetch(`/api/pages/${encodeURIComponent(selectedPage.id)}/posts`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        posts = data;
        // เด้งไปเดือนของโพสต์ล่าสุด เพื่อให้เห็นโพสต์ทันที
        if (posts.length) {
          const d = new Date(posts[0].createdTime);
          calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
        }
        renderCalendar();
        // เปิดโพสต์ล่าสุดอัตโนมัติบนจอกว้าง
        if (posts.length && window.innerWidth > 800) openPost(posts[0].id);
        else if (!posts.length) $('cmRight').innerHTML = '<div class="cm-empty"><span class="big">📭</span>เพจนี้ยังไม่มีโพสต์</div>';
      } catch (err) {
        $('calWrap').innerHTML = `<div class="cm-empty" style="padding:20px; text-align:center;"><span class="big">⚠️</span>${esc(err.message)}</div>`;
      }
    }

    const dayKey = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    function engBadges(p) {
      const parts = [];
      if (p.reactionCount) parts.push(`👍 ${p.reactionCount}`);
      if (p.commentCount) parts.push(`💬 ${p.commentCount}`);
      if (p.shareCount) parts.push(`↗ ${p.shareCount}`);
      return parts;
    }

    function calPostHtml(p) {
      const eng = engBadges(p);
      return `
        <div class="cal-post ${p.id === activePostId ? 'active' : ''}" title="${esc(p.message)}" onclick="openPost('${esc(p.id)}')">
          ${p.picture ? `<img src="${esc(p.picture)}" alt="">` : '<div class="cp-noimg"></div>'}
          <div class="cp-txt">${esc(p.message)}</div>
          ${eng.length ? `<div class="cp-eng">${eng.map((e) => `<span>${e}</span>`).join('')}</div>` : ''}
        </div>`;
    }

    function renderCalendar() {
      $('calTitle').textContent = calMonth.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
      // จัดกลุ่มโพสต์ตามวัน
      const byDay = {};
      for (const p of posts) {
        const k = dayKey(new Date(p.createdTime));
        (byDay[k] = byDay[k] || []).push(p);
      }
      const firstDow = calMonth.getDay();
      const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0).getDate();
      const todayKey = dayKey(new Date());
      let cells = '';
      // ช่องว่างก่อนวันที่ 1 (ให้จันทร์เป็นคอลัมน์แรก → shift)
      const lead = (firstDow + 6) % 7;
      for (let i = 0; i < lead; i++) cells += '<div class="cal-cell empty"></div>';
      for (let day = 1; day <= daysInMonth; day++) {
        const k = dayKey(new Date(calMonth.getFullYear(), calMonth.getMonth(), day));
        const dayPosts = byDay[k] || [];
        let inner = `<div class="daynum">${day}</div>`;
        if (dayPosts.length) {
          // วันที่มีหลายโพสต์: แสดงโพสต์ที่เลือกไว้ (หรือโพสต์แรก) + ปุ่ม +N
          const shown = dayPosts.find((p) => p.id === dayPostSel[k]) || dayPosts[0];
          inner += calPostHtml(shown);
          if (dayPosts.length > 1) {
            inner += `
              <div class="cal-more">
                <span class="cal-more-btn">+${dayPosts.length - 1} โพสต์อื่น</span>
                <div class="cal-more-menu">
                  ${dayPosts.map((p) => `
                    <div class="cal-more-item ${p.id === shown.id ? 'sel' : ''}" onclick="pickDayPost('${k}','${esc(p.id)}')">
                      ${p.picture ? `<img src="${esc(p.picture)}" alt="">` : ''}
                      <span class="t">${esc(p.message)}</span>
                    </div>`).join('')}
                </div>
              </div>`;
          }
        }
        cells += `<div class="cal-cell ${k === todayKey ? 'today' : ''}">${inner}</div>`;
      }
      $('calWrap').innerHTML = `
        <div class="cal-dow"><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span><span>อา</span></div>
        <div class="cal-grid">${cells}</div>`;
    }

    $('calPrev').addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCalendar(); });
    $('calNext').addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCalendar(); });

    // เลือกโพสต์จาก popup ของวันที่มีหลายโพสต์ → สลับรูปในช่อง + เปิดคอมเมนต์
    function pickDayPost(k, postId) {
      dayPostSel[k] = postId;
      openPost(postId); // openPost เรียก renderCalendar เองแล้ว
    }

    // ---------- คอมเมนต์ ----------
    function cmtAvatar(c) {
      const fallback = `<span class="ava-fb" style="background:${avatarColor(c.fromId || c.fromName)};${c.fromPic ? 'display:none;' : ''}">${esc(c.fromName[0])}</span>`;
      if (!c.fromPic) return fallback;
      return `<img class="ava" src="${esc(c.fromPic)}" alt=""
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${fallback}`;
    }

    function cmtHtml(c, isReply) {
      const byPage = selectedPage && c.fromId === selectedPage.id;
      return `
        <div class="cmt ${byPage ? 'by-page' : ''}">
          ${cmtAvatar(c)}
          <div class="box">
            <div class="bub"><div class="who">${esc(c.fromName)}${byPage ? ' · เพจ' : ''}</div>${c.message ? `<div class="txt">${esc(c.message)}</div>` : ''}</div>
            ${c.attachmentUrl ? `<img class="att" src="${esc(c.attachmentUrl)}" alt="" onclick="openLightbox(this.src)">` : ''}
            <div class="sub">
              ${!isReply ? `<span class="act" onclick="showReplyBox('${esc(c.id)}')">ตอบกลับ</span>` : ''}
              ${c.likeCount ? `<span>👍 ${c.likeCount}</span>` : ''}
              <span>${fmtAgo(c.createdTime)}</span>
            </div>
            ${!isReply ? `
              <div class="cmt-replies" id="replies-${esc(c.id)}" style="margin-left:0;">
                ${c.replies.map((r) => cmtHtml(r, true)).join('')}
              </div>
              <div class="reply-inline" id="replybox-${esc(c.id)}" style="display:none;">
                <input type="text" placeholder="ตอบในนาม ${esc(selectedPage ? selectedPage.name : 'เพจ')}..."
                  onkeydown="if(event.key==='Enter')sendReply('${esc(c.id)}');if(event.key==='Escape')this.parentElement.style.display='none';">
                <button class="btn small" onclick="sendReply('${esc(c.id)}')">ส่ง</button>
              </div>` : ''}
          </div>
        </div>`;
    }

    async function openPost(postId) {
      activePostId = postId;
      renderCalendar();
      $('cmLayout').classList.add('post-open');
      const post = posts.find((p) => p.id === postId);
      $('cmRight').innerHTML = '<div class="cm-empty"><span class="big">⏳</span>กำลังดึงคอมเมนต์...</div>';
      try {
        const res = await fetch(`/api/posts/${encodeURIComponent(postId)}/comments?pageId=${encodeURIComponent(selectedPage.id)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        currentComments = data; // เก็บไว้ให้ export CSV
        $('cmRight').innerHTML = `
          <div class="cm-post-head">
            <button class="btn small secondary" onclick="closePost()" style="display:none; float:left; margin-right:10px;" id="backBtn">←</button>
            <button class="btn small secondary" onclick="exportCommentsCSV()" style="float:right;" title="ดาวน์โหลดคอมเมนต์ทั้งหมดเป็นไฟล์ CSV">⬇ Export CSV</button>
            <div class="txt">${esc(post.message)}</div>
            <div class="muted" style="margin-top:4px;">
              ${fmtAgo(post.createdTime)}
              ${post.permalink ? ` · <a href="${esc(post.permalink)}" target="_blank">เปิดโพสต์บน Facebook ↗</a>` : ''}
            </div>
            <!-- ตรวจ caption กับหลักเกณฑ์การโฆษณาอาหารของ อย. (อยู่เหนือภาพตามที่ออกแบบไว้) -->
            <div class="fda-row" id="fdaRow" hidden>
              <button class="btn small secondary fda-btn" id="fdaBtn" onclick="runFdaCheck()"
                      title="ตรวจข้อความโพสต์กับหลักเกณฑ์การโฆษณาอาหารของ อย.">🛡 FDA Verify</button>
              <div class="fda-out" id="fdaResult"></div>
            </div>
            ${post.picture ? `<img class="post-hero" src="${esc(post.picture)}" alt="" onclick="openLightbox(this.src)">` : ''}
            <div class="eng-bar">
              <span class="eng">👍 <b>${post.reactionCount.toLocaleString()}</b> <span>ถูกใจ</span></span>
              <span class="eng">💬 <b>${data.length.toLocaleString()}</b> <span>คอมเมนต์</span></span>
              <span class="eng">↗ <b>${post.shareCount.toLocaleString()}</b> <span>แชร์</span></span>
            </div>
            <div class="stat-grid" id="statGrid"><div class="muted" style="font-size:12px;">⏳ กำลังโหลดสถิติเชิงลึก...</div></div>
          </div>
          <div class="cm-list" id="cmList">
            ${data.length ? data.map((c) => cmtHtml(c, false)).join('')
              : '<div class="muted" style="text-align:center; padding: 30px;">โพสต์นี้ยังไม่มีคอมเมนต์</div>'}
          </div>`;
        if (window.innerWidth <= 800) $('backBtn').style.display = 'inline-flex';
        loadInsights(postId);
        setupFdaButton(post);
      } catch (err) {
        $('cmRight').innerHTML = `<div class="cm-empty"><span class="big">⚠️</span><div style="max-width:420px; text-align:center;">${esc(err.message)}</div></div>`;
      }
    }

    // ---------- สถิติเชิงลึก (reach / impressions / clicks) ----------
    async function loadInsights(postId) {
      const el = $('statGrid');
      if (!el) return;
      try {
        const s = await fetch(`/api/posts/${encodeURIComponent(postId)}/insights?pageId=${encodeURIComponent(selectedPage.id)}`).then((r) => r.json());
        if (!s.available) {
          el.innerHTML = `<div class="muted" style="font-size:12px;">ℹ️ สถิติเชิงลึก (reach/impressions) ต้องเพิ่มสิทธิ์ <code>read_insights</code> แล้วเชื่อมเพจใหม่</div>`;
          return;
        }
        const n = (x) => (x || 0).toLocaleString();
        el.innerHTML = [
          ['👁 การเข้าถึง (Reach)', n(s.reach)],
          ['🌱 Organic Reach', n(s.organicReach)],
          ['💰 Paid Reach', n(s.paidReach)],
          ['📊 การมองเห็น (Impressions)', n(s.impressions)],
          ['🖱 คลิกที่โพสต์', n(s.clicks)],
        ].map(([label, val]) => `<div class="stat-box"><div class="sv">${val}</div><div class="sl">${label}</div></div>`).join('');
      } catch {
        el.innerHTML = '';
      }
    }

    // ---------- ตรวจโฆษณากับระบบ อย. (FDA Verify) ----------
    // เรียกผ่าน /api/fda/check ของเราเอง — API key อยู่ฝั่ง server ไม่ลงมาถึงหน้าเว็บ
    // ผลแสดงในลิ้นชักที่สไลด์มาจากขวา: ภาพ + ข้อความที่ตรวจ (ไฮไลต์คำที่มีปัญหา) + รายการข้อ
    // คลิกข้อ → กระโดดไปคำนั้นในข้อความ · คลิกคำ → กระโดดไปข้อที่เกี่ยวข้อง

    // ผลสรุป 4 ระดับของ อย. → สี + จุดนำหน้า (อิงหน้าตาของระบบ อย.)
    const FDA_STYLE = {
      no_issue_found:          { cls: 'fda-ok',    dot: '🟢' },
      allowed_with_conditions: { cls: 'fda-cond',  dot: '🟡' },
      requires_approval:       { cls: 'fda-appr',  dot: '🟠' },
      not_allowed:             { cls: 'fda-block', dot: '🔴' },
    };

    /**
     * จานสีสำหรับแยก "แต่ละข้อ" ไม่ใช่แต่ละหมวด
     * ข้อเดียวกัน = สีเดียวกันทั้งคำในข้อความและการ์ดฝั่งขวา → จับคู่ได้ด้วยตาโดยไม่ต้องกด
     * (หมวด ขัดข้อห้าม/ต้องขออนุญาต/มีเงื่อนไข ยังดูได้จากหัวข้อที่แยกกลุ่มไว้)
     * เรียงให้สีที่อยู่ติดกันต่างกันชัด เพราะข้อที่ติดกันมักถูกเทียบกันเอง
     */
    const FDA_COLORS = [
      { bg: '#ffd4d1', line: '#d93025' }, // แดง
      { bg: '#d5e4ff', line: '#1877f2' }, // น้ำเงิน
      { bg: '#ffe6bd', line: '#e08b1e' }, // ส้ม
      { bg: '#d3efd8', line: '#2e9e4f' }, // เขียว
      { bg: '#e6dcff', line: '#7c4dff' }, // ม่วง
      { bg: '#fff2b0', line: '#c99700' }, // เหลือง
      { bg: '#ffd9ec', line: '#d63384' }, // ชมพู
      { bg: '#c9eef0', line: '#0f9aa0' }, // เขียวน้ำทะเล
      { bg: '#e8ddc8', line: '#8d6e3a' }, // น้ำตาล
      { bg: '#dde1e6', line: '#5f6b7a' }, // เทา
    ];
    /** ข้อที่ไม่มีคำโผล่ในข้อความ ไม่ต้องกินสีในจาน — ใช้สีกลางแทน */
    const FDA_NEUTRAL = { bg: '#eceff2', line: '#98a2ad' };
    const fdaColorOf = (i) => (i == null ? FDA_NEUTRAL : FDA_COLORS[i % FDA_COLORS.length]);

    let fdaConfigReady = null; // null = ยังไม่รู้, true/false = ตั้ง FDA_API_KEY ไว้ไหม
    const fdaCache = new Map(); // postId -> ผลตรวจ (กันยิงซ้ำเมื่อสลับโพสต์ไปมา)

    async function setupFdaButton(post) {
      const row = $('fdaRow');
      if (!row) return;
      // ไม่มี caption ก็ไม่มีอะไรให้ตรวจ
      if (!post || !String(post.message || '').trim()) return;

      if (fdaConfigReady === null) {
        try {
          const cfg = await fetch('/api/config').then((r) => r.json());
          fdaConfigReady = !!cfg.fdaVerify;
        } catch { fdaConfigReady = false; }
      }
      if (!fdaConfigReady) return; // ยังไม่ได้ตั้งคีย์ที่เซิร์ฟเวอร์ → ไม่ต้องโชว์ปุ่มให้กดแล้วพัง
      row.hidden = false;

      // เคยตรวจโพสต์นี้ไปแล้วในรอบนี้ → แสดงผลสรุปเดิมทันที ไม่ยิงซ้ำ
      const cached = fdaCache.get(post.id);
      if (cached) renderFdaSummary(cached);
    }

    // แถบสรุปเล็ก ๆ ใต้ปุ่ม (คลิกเพื่อเปิดลิ้นชักอีกครั้ง)
    function renderFdaSummary(r) {
      const box = $('fdaResult');
      if (!box) return;
      const style = FDA_STYLE[r.verdict] || FDA_STYLE.not_allowed;
      box.innerHTML = `
        <div class="fda-bubble ${style.cls}" style="cursor:pointer" onclick="openFdaDrawer()"
             title="กดเพื่อดูรายละเอียด">
          <span class="dot">${style.dot}</span>
          <span><span class="label">${esc(r.verdictLabel)}</span>
            <span class="score"> · ความเสี่ยง ${esc(String(r.riskLevel).toUpperCase())} (${r.riskScore}/100)</span>
          </span>
        </div>`;
    }

    // ---- ลิ้นชัก ----
    function ensureFdaDrawer() {
      if ($('fdaDrawer')) return;
      const scrim = document.createElement('div');
      scrim.className = 'fda-scrim'; scrim.id = 'fdaScrim'; scrim.hidden = true;
      scrim.addEventListener('click', closeFdaDrawer);

      const d = document.createElement('aside');
      d.className = 'fda-drawer'; d.id = 'fdaDrawer'; d.hidden = true;
      d.setAttribute('role', 'dialog');
      d.setAttribute('aria-label', 'ผลตรวจโฆษณากับระบบ อย.');
      d.innerHTML = `
        <div class="fda-dhead">
          <span class="t">🛡 ตรวจโฆษณากับระบบ อย.</span>
          <button class="x" type="button" aria-label="ปิด" onclick="closeFdaDrawer()">×</button>
        </div>
        <div class="fda-dverdict" id="fdaDVerdict"></div>
        <div class="fda-dcols">
          <div class="fda-dtop" id="fdaDTop"></div>
          <div class="fda-dbody" id="fdaDBody"></div>
        </div>`;
      document.body.append(scrim, d);
    }

    function openFdaDrawer() {
      ensureFdaDrawer();
      $('fdaScrim').hidden = false; $('fdaDrawer').hidden = false;
      // อ่าน offsetWidth เพื่อบังคับ reflow ให้เบราว์เซอร์รับรู้สถานะเริ่มต้นก่อน แล้วค่อยติด class
      // (ไม่ใช้ requestAnimationFrame เพราะแท็บที่ไม่ได้อยู่หน้าจออาจไม่ยิง → ลิ้นชักจะเปิดแต่มองไม่เห็น)
      void $('fdaDrawer').offsetWidth;
      $('fdaScrim').classList.add('show'); $('fdaDrawer').classList.add('show');
      document.addEventListener('keydown', fdaEscClose);
      const cached = fdaCache.get(activePostId);
      if (cached) renderFdaDrawer(cached);
    }

    function closeFdaDrawer() {
      const scrim = $('fdaScrim'), d = $('fdaDrawer');
      if (!d) return;
      scrim.classList.remove('show'); d.classList.remove('show');
      document.removeEventListener('keydown', fdaEscClose);
      // รอสไลด์ออกให้จบก่อนค่อยซ่อน ไม่งั้นจะวูบหาย
      setTimeout(() => { scrim.hidden = true; d.hidden = true; }, 260);
    }

    function fdaEscClose(e) { if (e.key === 'Escape') closeFdaDrawer(); }

    async function runFdaCheck() {
      const post = posts.find((p) => p.id === activePostId);
      if (!post) return;
      openFdaDrawer();
      renderFdaDrawerShell(post, '<div class="fda-bubble fda-err loading">'
        + '<span class="dot">⏳</span><span>กำลังตรวจกับระบบ อย....</span></div>');

      const cached = fdaCache.get(post.id);
      if (cached) { renderFdaDrawer(cached); return; }

      const btn = $('fdaBtn');
      if (btn) btn.disabled = true;
      try {
        const res = await fetch('/api/fda/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: post.message }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'ตรวจไม่สำเร็จ');
        fdaCache.set(post.id, data);
        renderFdaDrawer(data);
        renderFdaSummary(data);
      } catch (err) {
        renderFdaDrawerShell(post, '<div class="fda-bubble fda-err">'
          + '<span class="dot">⚠️</span><span>' + esc(err.message || 'ตรวจไม่สำเร็จ') + '</span></div>');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    // ---- ไฮไลต์คำที่ตรวจพบในข้อความ ----
    // รวมช่วงคำจากทุกกลุ่ม เรียงตามตำแหน่ง แล้วตัดช่วงที่ทับกัน (กลุ่มที่หนักกว่าชนะ)
    function fdaHighlight(text, r) {
      const groups = [
        { kind: 'bad',  items: r.violations || [],        key: (it) => it.title },
        { kind: 'appr', items: r.approvalsRequired || [], key: (it) => it.topic },
        { kind: 'cond', items: r.conditionalItems || [],  key: (it) => it.topic },
      ];
      const hay = text.toLowerCase();
      const ranges = [];
      groups.forEach((g, rank) => g.items.forEach((it, idx) => {
        (it.matched || []).forEach((m) => {
          const needle = String(m || '').trim();
          if (!needle) return;
          const nee = needle.toLowerCase();
          let from = 0, at;
          while ((at = hay.indexOf(nee, from)) !== -1) {
            ranges.push({ start: at, end: at + needle.length, kind: g.kind, fid: g.kind + '-' + idx, rank });
            from = at + needle.length;
          }
        });
      }));
      // ตำแหน่งเดียวกันให้ตัวที่หนักกว่า (rank น้อยกว่า) และช่วงที่ยาวกว่าชนะ
      ranges.sort((a, b) => a.start - b.start || a.rank - b.rank || (b.end - b.start) - (a.end - a.start));

      // แจกสีเฉพาะข้อที่มีคำโผล่จริงในข้อความ เรียงตามลำดับที่พบจากบนลงล่าง
      // (ถ้าแจกให้ทุกข้อรวมข้อที่ไม่มีคำ เลขสีจะวนเกินจานแล้วสีซ้ำกันทั้งที่ยังมีสีว่าง)
      const colorOfFid = new Map();

      let html = '', cursor = 0, n = 0;
      for (const rg of ranges) {
        if (rg.start < cursor) continue; // ทับกับช่วงก่อนหน้า — ข้าม
        if (!colorOfFid.has(rg.fid)) colorOfFid.set(rg.fid, colorOfFid.size);
        const c = fdaColorOf(colorOfFid.get(rg.fid));
        html += esc(text.slice(cursor, rg.start));
        html += `<mark class="fda-hl" id="fdaHl${n}" data-fid="${rg.fid}"
                   style="background:${c.bg};box-shadow:inset 0 -2px 0 ${c.line}"
                   onclick="fdaJumpToItem('${rg.fid}')" title="กดเพื่อดูข้อที่เกี่ยวข้อง"
                 >${esc(text.slice(rg.start, rg.end))}</mark>`;
        cursor = rg.end; n++;
      }
      html += esc(text.slice(cursor));
      return { html, count: n, colorOfFid };
    }

    // ส่วนบนของลิ้นชัก: ผลสรุป + ภาพ + ข้อความ
    function renderFdaDrawerShell(post, topHtml, textHtml, hlCount) {
      ensureFdaDrawer();
      const img = post.picture
        ? `<img class="fda-dimg" src="${esc(post.picture)}" alt="" onclick="openLightbox(this.src)">` : '';
      const hint = hlCount
        ? `<div class="fda-dtext-cap">ข้อความที่ตรวจ · ไฮไลต์ ${hlCount} จุด — กดที่คำเพื่อดูข้อที่เกี่ยวข้อง</div>`
        : '<div class="fda-dtext-cap">ข้อความที่ตรวจ</div>';
      $('fdaDVerdict').innerHTML = topHtml;
      $('fdaDTop').innerHTML = img + hint
        + `<div class="fda-dtext" id="fdaDText">${textHtml != null ? textHtml : esc(post.message || '')}</div>`;
    }

    /**
     * colorIdx = undefined แปลว่าข้อนี้ไม่มีคำไฮไลต์ในข้อความ
     * (เกิดได้เมื่อคำเดียวกันถูกสองข้ออ้าง แล้วอีกข้อชนะการทับซ้อน) → ใช้สีกลางและไม่ชวนให้กดกระโดด
     */
    function fdaItemHtml(kind, idx, title, clause, matched, body, colorIdx) {
      const c = fdaColorOf(colorIdx);
      const jumpable = colorIdx != null;
      return `<div class="fda-item${jumpable ? '' : ' no-jump'}" id="fdaItem-${kind}-${idx}"
                   style="border-left-color:${c.line}"
                   ${jumpable ? `onclick="fdaJumpToText('${kind}-${idx}')"` : ''}>
        <div class="it-title"><span class="it-dot" style="background:${c.line}"></span>${esc(title)}</div>
        <div class="it-clause">${esc(clause)}</div>
        ${(matched || []).map((m) => `<span class="hit">${esc(m)}</span>`).join('')}
        ${body ? `<div class="it-body">${body}</div>` : ''}
        ${jumpable ? '<span class="jump">↑ กดเพื่อกระโดดไปจุดที่พบในข้อความ</span>' : ''}
      </div>`;
    }

    function renderFdaDrawer(r) {
      const post = posts.find((p) => p.id === activePostId);
      if (!post) return;
      ensureFdaDrawer();
      const style = FDA_STYLE[r.verdict] || FDA_STYLE.not_allowed;
      const hl = fdaHighlight(String(post.message || ''), r);

      renderFdaDrawerShell(post, `
        <div class="fda-bubble ${style.cls}">
          <span class="dot">${style.dot}</span>
          <span><span class="label">${esc(r.verdictLabel)}</span>
            <span class="score"> · ความเสี่ยง ${esc(String(r.riskLevel).toUpperCase())} (${r.riskScore}/100)</span>
          </span>
        </div>`, hl.html, hl.count);

      const parts = [];
      if (r.violations.length) {
        parts.push(`<div class="fda-sec">❌ ขัดต่อข้อห้าม — ต้องแก้ไข ขออนุญาตไม่ได้ (${r.violations.length})</div>`);
        parts.push(r.violations.map((v, i) => fdaItemHtml('bad', i, v.title, v.clause, v.matched,
          v.fix ? `<b>แก้อย่างไร:</b> ${esc(v.fix)}` : '', hl.colorOfFid.get('bad-' + i))).join(''));
      }
      if (r.approvalsRequired.length) {
        parts.push(`<div class="fda-sec">📋 ต้องยื่นขออนุญาตโฆษณาก่อน (${r.approvalsRequired.length})</div>`);
        parts.push(r.approvalsRequired.map((a, i) => fdaItemHtml('appr', i, a.topic, a.clause, a.matched,
          [a.evidence ? `<b>หลักฐาน:</b> ${esc(a.evidence)}` : '',
           a.condition ? `<b>เงื่อนไข:</b> ${esc(a.condition)}` : ''].filter(Boolean).join('<br>'),
          hl.colorOfFid.get('appr-' + i))).join(''));
      }
      if (r.conditionalItems.length) {
        parts.push(`<div class="fda-sec">🟡 โฆษณาได้ถ้าเข้าเงื่อนไข (${r.conditionalItems.length})</div>`);
        parts.push(r.conditionalItems.map((c, i) => fdaItemHtml('cond', i, c.topic, c.clause, c.matched,
          c.condition ? `<b>เงื่อนไข:</b> ${esc(c.condition)}` : '', hl.colorOfFid.get('cond-' + i))).join(''));
      }
      if (r.requiredWarnings.length) {
        parts.push('<div class="fda-sec">⚠️ ต้องมีคำเตือน</div>');
        parts.push(r.requiredWarnings.map((w) => `<div class="fda-item">${esc(w)}</div>`).join(''));
      }
      if (r.recommendations.length) {
        parts.push('<div class="fda-sec">💡 คำแนะนำ</div>');
        parts.push(r.recommendations.slice(0, 4).map((c) =>
          `<div class="fda-item" style="cursor:default">
             <div class="it-title">${esc(c.title)}</div>
             <div class="it-body">${esc(c.detail)}</div>
           </div>`).join(''));
      }
      if (r.manualChecks.length) {
        parts.push(`<div class="fda-sec">👁 ต้องตรวจเองเพิ่ม (${r.manualChecks.length})</div>`);
        parts.push(r.manualChecks.map((m) =>
          `<div class="fda-item" style="cursor:default">
             <div class="it-title">${esc(m.title)}</div>
             <div class="it-clause">${esc(m.clause)}</div>
             <div class="it-body">${esc(m.note)}</div>
           </div>`).join(''));
      }
      parts.push(`<div class="fda-foot">
        ระบบตรวจจากตัวข้อความเป็นหลัก ยังต้องตรวจภาพ เสียง กราฟิก และบริบทโดยรวมเอง<br>
        ${r.regulationTitle ? 'อ้างอิง: ' + esc(r.regulationTitle) : ''}
      </div>`);

      $('fdaDBody').innerHTML = parts.join('');
    }

    /**
     * เลื่อน container ให้ el มาอยู่กลางกล่อง
     *
     * จงใจกำหนด scrollTop ตรง ๆ ไม่ทำอนิเมชัน — ทดสอบแล้วพบว่าทั้ง
     * scrollIntoView({behavior:'smooth'}), CSS scroll-behavior: smooth และ
     * requestAnimationFrame ถูกเมินได้ในบางบริบท (เช่นแท็บที่ไม่ได้อยู่หน้าจอ)
     * ซึ่งจะทำให้ "กระโดดไม่ไป" เลย · การกะพริบที่คำ (.flash) ทำหน้าที่ชี้จุดให้ตาแทนอยู่แล้ว
     */
    function fdaScrollWithin(container, el) {
      const delta = el.getBoundingClientRect().top - container.getBoundingClientRect().top;
      const max = container.scrollHeight - container.clientHeight;
      container.scrollTop = Math.max(0, Math.min(max,
        container.scrollTop + delta - container.clientHeight / 2 + el.offsetHeight / 2));
    }

    // คลิกที่ "ข้อ" → เลื่อนข้อความไปหาคำแรกของข้อนั้น แล้วกะพริบให้เห็น
    function fdaJumpToText(fid) {
      const mark = document.querySelector(`#fdaDText [data-fid="${fid}"]`);
      if (!mark) return;
      fdaScrollWithin($('fdaDText'), mark);
      document.querySelectorAll('#fdaDText .fda-hl.flash').forEach((m) => m.classList.remove('flash'));
      // ต้อง reflow ก่อน ไม่งั้นการใส่ class ซ้ำจะไม่รีสตาร์ต animation
      void mark.offsetWidth;
      mark.classList.add('flash');
      fdaMarkActive(fid);
    }

    // คลิกที่ "คำ" ในข้อความ → เลื่อนรายการไปหาข้อที่เกี่ยวข้อง
    function fdaJumpToItem(fid) {
      const item = $('fdaItem-' + fid);
      if (!item) return;
      fdaScrollWithin($('fdaDBody'), item);
      fdaMarkActive(fid);
    }

    function fdaMarkActive(fid) {
      document.querySelectorAll('#fdaDBody .fda-item.on').forEach((el) => el.classList.remove('on'));
      const item = $('fdaItem-' + fid);
      if (item) item.classList.add('on');
    }

    // ---------- Export CSV ----------
    function csvCell(v) {
      const s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function exportCommentsCSV() {
      if (!currentComments.length) { toast('โพสต์นี้ยังไม่มีคอมเมนต์'); return; }
      const post = posts.find((p) => p.id === activePostId);
      const rows = [['ระดับ', 'ผู้แสดงความเห็น', 'ข้อความ', 'จำนวนไลก์', 'วันเวลา', 'ตอบใต้คอมเมนต์ของ']];
      const fmt = (iso) => new Date(iso).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
      for (const c of currentComments) {
        rows.push(['คอมเมนต์', c.fromName, c.message, c.likeCount, fmt(c.createdTime), '']);
        for (const r of (c.replies || [])) {
          rows.push(['ตอบกลับ', r.fromName, r.message, r.likeCount, fmt(r.createdTime), c.fromName]);
        }
      }
      const csv = '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n'); // BOM ให้ Excel อ่านไทยถูก
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 10);
      const name = (post && post.message ? post.message.slice(0, 30).replace(/[^\wก-๙]+/g, '_') : 'post');
      a.href = url;
      a.download = `comments_${name}_${stamp}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast(`ดาวน์โหลด ${currentComments.length} คอมเมนต์เป็น CSV แล้ว`);
    }

    function closePost() {
      $('cmLayout').classList.remove('post-open');
    }

    function showReplyBox(commentId) {
      const box = $('replybox-' + commentId);
      box.style.display = 'flex';
      box.querySelector('input').focus();
    }

    async function sendReply(commentId) {
      const box = $('replybox-' + commentId);
      const input = box.querySelector('input');
      const text = input.value.trim();
      if (!text) return;
      const btn = box.querySelector('button');
      btn.disabled = true; input.disabled = true;
      try {
        const res = await fetch(`/api/comments/${encodeURIComponent(commentId)}/reply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pageId: selectedPage.id, message: text }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        // เติม reply ที่ส่งแล้วเข้าไปใต้คอมเมนต์ทันที
        $('replies-' + commentId).insertAdjacentHTML('beforeend', cmtHtml({
          id: data.id, message: text, createdTime: new Date().toISOString(),
          fromId: selectedPage.id, fromName: data.pageName, fromPic: selectedPage.pictureUrl || '',
          likeCount: 0, attachmentUrl: '', replies: [],
        }, true));
        input.value = '';
        box.style.display = 'none';
        toast('ตอบคอมเมนต์แล้ว ✓');
      } catch (err) {
        toast('❌ ' + err.message);
      } finally {
        btn.disabled = false; input.disabled = false;
      }
    }

    $('refreshBtn').addEventListener('click', () => {
      if (activePostId) { loadPosts(); }
      else loadPosts();
    });

    loadPages();
  </script>
  <script src="https://agencyitelligence-production.up.railway.app/global-menu.js" defer></script>
