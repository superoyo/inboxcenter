<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competitor — FB Inbox Center</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
  <script src="project.js"></script>
  <style>
    .cm-layout { display: grid; grid-template-columns: 1fr 420px; height: calc(100vh - 56px); background: var(--card); }
    html.embed .cm-layout { height: 100vh; }
    @media (max-width: 900px) { .cm-layout { grid-template-columns: 1fr; } .cm-right { display: none; } }
    .cm-left { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .cm-left-head { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cmp-title { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
    .cmp-ava { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
    .cal-nav-group { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .cal-title { font-weight: 700; font-size: 15px; min-width: 128px; text-align: center; }
    .cal-nav { border: 1px solid var(--border); background: var(--card); border-radius: 8px; width: 32px; height: 32px; font-size: 16px; cursor: pointer; color: var(--text); }
    .cal-nav:hover { background: var(--bg); }
    .cmp-sel { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px; font-family: inherit; width: auto; }

    /* ปฏิทินโพสต์ (ดีไซน์เดียวกับหน้า Content) */
    .cal-wrap { flex: 1; overflow-y: auto; padding: 10px 14px 20px; }
    .cal-dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 4px; }
    .cal-dow span { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; grid-auto-rows: 135px; }
    .cal-cell { border: 1px solid var(--border); border-radius: 8px; height: 135px; min-width: 0; padding: 4px;
      display: flex; flex-direction: column; gap: 3px; overflow: visible; }
    .cal-cell.empty { border-color: transparent; background: transparent; }
    .cal-cell.today { border-color: var(--primary); }
    .cal-cell .daynum { font-size: 12px; font-weight: 700; color: var(--muted); padding: 1px 3px; }
    .cal-cell.today .daynum { color: var(--primary); }
    .cal-post { cursor: pointer; border-radius: 6px; overflow: hidden; min-width: 0; border: 1px solid var(--border); background: var(--card); }
    .cal-post:hover { border-color: var(--primary); }
    .cal-post.active { outline: 2px solid var(--primary); }
    .cal-post img, .cal-post .cp-noimg { width: 100%; height: 40px; object-fit: cover; display: block; background: var(--bg); }
    .cal-post .cp-txt { font-size: 10.5px; line-height: 1.3; padding: 2px 4px; min-height: 2.6em;
      overflow-wrap: anywhere; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .cal-post .cp-eng { display: flex; gap: 6px; font-size: 9.5px; color: var(--muted); padding: 0 4px 3px; flex-wrap: nowrap; overflow: hidden; }
    .cal-post .cp-eng span { white-space: nowrap; }
    .cal-more { position: relative; }
    .cal-more-btn { display: inline-block; font-size: 10px; font-weight: 700; color: var(--primary);
      background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; cursor: pointer; }
    .cal-more-btn:hover { background: #e7f0fe; }
    .cal-more-menu { display: none; position: absolute; top: 100%; left: 0; z-index: 60; width: 230px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.18); padding: 4px; margin-top: 2px; }
    .cal-more:hover .cal-more-menu { display: block; }
    .cal-more-item { display: flex; gap: 7px; padding: 6px 7px; border-radius: 6px; cursor: pointer; align-items: center; }
    .cal-more-item:hover { background: var(--bg); }
    .cal-more-item img { width: 30px; height: 30px; object-fit: cover; border-radius: 5px; flex-shrink: 0; background: var(--bg); }
    .cal-more-item .t { font-size: 11px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    /* คอลัมน์ขวา: รายละเอียดโพสต์ */
    .cm-right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .cm-post-head { padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .cm-post-body { flex: 1; overflow-y: auto; padding: 14px 18px 24px; }
    .post-hero { width: 100%; border-radius: 10px; display: block; margin-bottom: 12px; background: var(--bg); }
    .post-cap { font-size: 14px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .stat-box { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; text-align: center; }
    .stat-box b { display: block; font-size: 17px; }
    .stat-box span { color: var(--muted); font-size: 11px; }
    .cm-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); text-align: center; padding: 30px; }
    .cm-empty .big { font-size: 42px; }
    .cm-empty .btn { margin-top: 8px; }

    /* Panel ประวัติการดึงข้อมูล */
    .hs-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 300; padding: 20px; }
    .hs-bg.open { display: flex; }
    .hs-modal { background: var(--card); border-radius: 14px; width: 620px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
    .hs-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .hs-body { padding: 14px 18px; overflow-y: auto; }
    .hs-run { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
    .hs-run .r1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hs-run .t { font-weight: 700; }
    .hs-run .sum { margin-left: auto; color: var(--muted); }
    .hs-run .det { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.6; }
  </style>
</head>
<body>
  <nav class="navbar">
    <span data-global-menu></span>
    <a class="logo" href="projects.html">📥 FB Inbox Center</a>
    <span class="spacer"></span>
    <a class="nav-link active" href="competitors.html">Competitor</a>
    <a class="nav-link" href="connect.html">Connect</a>
  </nav>

  <div class="cm-layout">
    <div class="cm-left">
      <div class="cm-left-head">
        <a class="btn small secondary" href="competitors.html">←</a>
        <div class="cmp-title" id="cmpTitle"><span class="muted">กำลังโหลด...</span></div>
        <select class="cmp-sel" id="rangeSel" title="ช่วงเวลาที่จะดึง">
          <option value="current">เดือนปัจจุบัน</option>
          <option value="prev">เดือนก่อนหน้า</option>
          <option value="3m">3 เดือนย้อนหลัง</option>
          <option value="6m">6 เดือนย้อนหลัง</option>
        </select>
        <button class="btn small" id="syncBtn">⬇ ดึงข้อมูล</button>
        <button class="btn small secondary" id="histBtn" title="ประวัติการดึงข้อมูล">📜</button>
        <div class="cal-nav-group">
          <button class="cal-nav" id="calPrev">‹</button>
          <span class="cal-title" id="calTitle"></span>
          <button class="cal-nav" id="calNext">›</button>
        </div>
      </div>
      <div class="cal-wrap" id="calWrap"><div class="cm-empty"><span class="big">⏳</span>กำลังโหลด...</div></div>
    </div>

    <main class="cm-right" id="cmRight">
      <div class="cm-empty"><span class="big">📅</span><div>เลือกโพสต์จากปฏิทินเพื่อดูรายละเอียด</div></div>
    </main>
  </div>

  <div class="hs-bg" id="histBg">
    <div class="hs-modal" onclick="event.stopPropagation()">
      <div class="hs-head">
        <div>
          <h2 style="font-size:17px;">📜 ประวัติการดึงข้อมูล</h2>
          <div class="muted" id="histSub" style="font-size:12px;margin-top:2px;"></div>
        </div>
        <button class="btn small secondary" onclick="closeHist()">✕</button>
      </div>
      <div class="hs-body" id="histBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const cid = new URLSearchParams(location.search).get('id') || '';
    let cmp = null, posts = [], calMonth = new Date(), activeId = null;

    function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3200); }
    function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    const COLORS=['#1877f2','#e91e63','#8e24aa','#5e35b1','#3949ab','#00897b','#f4511e','#6d4c41','#546e7a','#c2185b','#2e7d32','#ef6c00'];
    function color(k){ let h=0; for(const ch of String(k||'?')) h=(h*31+ch.codePointAt(0))>>>0; return COLORS[h%COLORS.length]; }
    const nf = (n)=> (n||0).toLocaleString('th-TH');
    const dayKey = (iso)=>{ const d=new Date(iso); return isNaN(d)?'':new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
    const fmtDT = (iso)=> iso ? new Date(iso).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}) : '—';

    async function load(){
      if(!cid){ location.replace('competitors.html'); return; }
      const d = await fetch('/api/competitors/'+encodeURIComponent(cid)).then(r=>r.json());
      if(d.error){ $('calWrap').innerHTML = `<div class="cm-empty"><span class="big">⚠️</span>${esc(d.error)}</div>`; return; }
      cmp = d; posts = d.posts || [];
      $('cmpTitle').innerHTML = (cmp.pictureUrl
          ? `<img class="cmp-ava" src="${esc(cmp.pictureUrl)}" alt="">`
          : `<span class="cmp-ava" style="background:${color(cmp.id)}">${esc((cmp.name||'?')[0].toUpperCase())}</span>`)
        + `<span>${esc(cmp.name||cmp.handle)}</span>`
        + `<a href="${esc(cmp.url)}" target="_blank" rel="noopener" class="muted" style="font-size:12px;text-decoration:none;">↗</a>`;
      // ยังไม่เคยดึง → ตั้ง default เป็น 3 เดือน / เคยดึงแล้ว → เดือนปัจจุบัน (ดึงเฉพาะส่วนเพิ่ม)
      $('rangeSel').value = cmp.lastSyncAt ? 'current' : '3m';
      // เปิดปฏิทินไปที่เดือนของโพสต์ล่าสุดที่มี
      if (posts.length) { const t=new Date(posts[0].time); if(!isNaN(t)) calMonth = new Date(t.getFullYear(), t.getMonth(), 1); }
      renderCal();
    }

    function renderCal(){
      if(!cmp.lastSyncAt && !posts.length){
        $('calTitle').textContent = '';
        $('calWrap').innerHTML = `<div class="cm-empty"><span class="big">⬇</span>
          <div><b>ยังไม่เคยดึงข้อมูลเพจนี้</b></div>
          <div>เลือกช่วงเวลาด้านบน แล้วกด "ดึงข้อมูล" เพื่อเริ่มเก็บโพสต์</div>
          <button class="btn" onclick="doSync()">⬇ ดึงข้อมูลตอนนี้</button></div>`;
        return;
      }
      const y = calMonth.getFullYear(), m = calMonth.getMonth();
      $('calTitle').textContent = calMonth.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
      const byDay = {};
      for(const p of posts){ const k=dayKey(p.time); if(k) (byDay[k]=byDay[k]||[]).push(p); }
      const first = new Date(y,m,1), days = new Date(y,m+1,0).getDate();
      const lead = (first.getDay()+6)%7; // เริ่มสัปดาห์วันจันทร์
      const todayK = dayKey(new Date().toISOString());
      let html = '<div class="cal-dow">' + ['จ','อ','พ','พฤ','ศ','ส','อา'].map(d=>`<span>${d}</span>`).join('') + '</div><div class="cal-grid">';
      html += '<div class="cal-cell empty"></div>'.repeat(lead);
      for(let d=1; d<=days; d++){
        const k = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const list = (byDay[k]||[]).sort((a,b)=>new Date(a.time)-new Date(b.time));
        html += `<div class="cal-cell ${k===todayK?'today':''}"><div class="daynum">${d}</div>`;
        if(list[0]) html += postCard(list[0]);
        if(list.length>1){
          html += `<div class="cal-more"><span class="cal-more-btn">+${list.length-1} โพสต์อื่น</span>
            <div class="cal-more-menu">${list.slice(1).map(p=>`
              <div class="cal-more-item" onclick="openPost('${esc(p.id)}')">
                ${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="" onerror="this.style.visibility='hidden'">`:'<img alt="">'}
                <div class="t">${esc((p.text||'(ไม่มีข้อความ)').slice(0,80))}</div>
              </div>`).join('')}</div></div>`;
        }
        html += '</div>';
      }
      html += '</div>';
      $('calWrap').innerHTML = html;
    }

    function postCard(p){
      return `<div class="cal-post ${p.id===activeId?'active':''}" onclick="openPost('${esc(p.id)}')" title="${esc((p.text||'').slice(0,120))}">
        ${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="" onerror="this.className='cp-noimg';this.removeAttribute('src')">` : '<div class="cp-noimg"></div>'}
        <div class="cp-txt">${esc(p.text||'(ไม่มีข้อความ)')}</div>
        <div class="cp-eng"><span>👍 ${nf(p.likes)}</span><span>💬 ${nf(p.comments)}</span><span>↗ ${nf(p.shares)}</span></div>
      </div>`;
    }

    function openPost(id){
      const p = posts.find(x=>x.id===id); if(!p) return;
      activeId = id; renderCal();
      $('cmRight').innerHTML = `
        <div class="cm-post-head">
          <div class="muted" style="font-size:12px;">${fmtDT(p.time)}
            ${p.url?` · <a href="${esc(p.url)}" target="_blank" rel="noopener">เปิดโพสต์บน Facebook ↗</a>`:''}</div>
        </div>
        <div class="cm-post-body">
          ${p.imageUrl?`<img class="post-hero" src="${esc(p.imageUrl)}" alt="" onerror="this.style.display='none'">`:''}
          <div class="stat-grid">
            <div class="stat-box"><b>${nf(p.likes)}</b><span>👍 ถูกใจ</span></div>
            <div class="stat-box"><b>${nf(p.comments)}</b><span>💬 คอมเมนต์</span></div>
            <div class="stat-box"><b>${nf(p.shares)}</b><span>↗ แชร์</span></div>
          </div>
          <div class="post-cap">${esc(p.text||'(ไม่มีข้อความ)')}</div>
        </div>`;
    }

    async function doSync(){
      const btn = $('syncBtn'); const range = $('rangeSel').value;
      btn.disabled = true; const old = btn.textContent; btn.textContent = '⏳ กำลังดึง...';
      toast('เริ่มดึงข้อมูลจาก Apify — อาจใช้เวลาหลายนาที');
      try{
        const res = await fetch(`/api/competitors/${encodeURIComponent(cid)}/sync`,{
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ range })
        });
        const d = await res.json();
        if(!res.ok) throw new Error(d.error);
        const r = d.run;
        toast(r.skipped ? 'ข้อมูลช่วงนี้ครบแล้ว ไม่มีอะไรต้องดึงเพิ่ม'
                        : `ดึงเสร็จ — เพิ่มโพสต์ใหม่ ${r.added} รายการ (ดึงมา ${r.fetched})`);
        await load();
      }catch(e){ toast('❌ ' + (e.message||'ดึงไม่สำเร็จ')); }
      finally{ btn.disabled=false; btn.textContent=old; }
    }

    async function openHist(){
      $('histBg').classList.add('open');
      $('histSub').textContent = cmp
        ? (cmp.coveredFrom ? `มีข้อมูลช่วง ${cmp.coveredFrom} → ${cmp.coveredTo} · ${posts.length} โพสต์` : 'ยังไม่มีข้อมูล')
        : '';
      const runs = await fetch(`/api/competitors/${encodeURIComponent(cid)}/sync-history`).then(r=>r.json()).catch(()=>[]);
      $('histBody').innerHTML = runs.length ? runs.map(r=>`
        <div class="hs-run">
          <div class="r1">
            <span class="t">${fmtDT(r.startedAt)}</span>
            <span>${esc(r.rangeLabel||r.range||'')}</span>
            <span class="sum">${r.ok ? `+${r.added} ใหม่ / ดึงมา ${r.fetched}` : '<span style="color:var(--red);font-weight:700;">ล้มเหลว</span>'}</span>
          </div>
          <div class="det">
            ขอช่วง ${esc(r.requested?.from||'')} → ${esc(r.requested?.to||'')}
            ${r.skipped ? ' · ครบแล้ว ไม่ต้องดึงเพิ่ม'
              : ' · ดึงจริง: ' + (r.gaps||[]).map(g=>`${g.from}→${g.to}`).join(', ')}
            ${r.error?`<br><span style="color:var(--red);">${esc(r.error)}</span>`:''}
          </div>
        </div>`).join('')
        : '<div class="muted" style="padding:12px;">ยังไม่มีประวัติการดึงข้อมูล — กดปุ่ม "ดึงข้อมูล" เพื่อเริ่ม</div>';
    }
    function closeHist(){ $('histBg').classList.remove('open'); }

    $('syncBtn').addEventListener('click', doSync);
    $('histBtn').addEventListener('click', openHist);
    $('histBg').addEventListener('click', (e)=>{ if(e.target===$('histBg')) closeHist(); });
    $('calPrev').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCal(); });
    $('calNext').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCal(); });
    load();
  </script>
</body>
</html>
